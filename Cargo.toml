[workspace]
members = [
    "crates/core",
    "crates/host",
    "crates/mux",
    "crates/winhost",
]
resolver = "2"

[profile.release.package.ssh-app-host]
opt-level = "s"

# The vault's password hashing is deliberately slow; unoptimised it makes the tests take minutes.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
