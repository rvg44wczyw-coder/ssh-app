[package]
name = "ssh-core"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "ssh_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
cli = ["uniffi/cli"]
# Test-only entry points (fake Ollama port); never part of the UniFFI surface.
test-support = []

[dependencies]
russh = { version = "0.63", default-features = false, features = ["aws-lc-rs", "flate2"] }
ssh-key = { version = "0.7.0-rc.11", features = ["ed25519", "std", "alloc", "crypto", "encryption"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "fs"] }
async-trait = "0.1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
rand = "0.10"
regex = "1"
tracing = "0.1"
uniffi = { version = "0.32", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
base64 = "0.22"
ed25519-dalek = "3"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
subtle = "2"

[dev-dependencies]
ssh-core = { path = ".", features = ["test-support"] }
tempfile = "3"
